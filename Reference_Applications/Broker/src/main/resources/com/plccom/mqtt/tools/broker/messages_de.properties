listener.clientCertMode.tip=TLS-Handshake-Regel dieses Listeners: NONE fordert nie ein Client-Zertifikat an, OPTIONAL fordert eines an, akzeptiert aber auch Verbindungen ohne, REQUIRED bricht den TLS-Handshake ohne Client-Zertifikat ab. Jeder TLS/WSS-Listener hat seinen eigenen Modus.
listener.maxConnections.tip=Maximale Anzahl gleichzeitiger Netzwerkverbindungen zum Broker.
listener.socketReadTimeout.tip=Zeitlimit fuer blockierende Socket-Leseoperationen. Es hilft, haengende Verbindungen sauber zu erkennen.
listener.diagnosticLevel.tip=Steuert das gesamte Log: Broker-Diagnosemeldungen und die Meldungen des Tools. Zugriffsablehnungen sind Warnungen; waehlen Sie Warnung oder ein ausfuehrlicheres Level, um abgelehnte CONNECT-, PUBLISH- und SUBSCRIBE-Entscheidungen zu sehen. Aus blendet alles aus.
access.row.tip=Fachliche Zugriffsregeln, die nach MQTT CONNECT sowie bei jedem Publish/Subscribe geprueft werden. Ist keine Regel aktiv, wird kein Access-Validator installiert und jeder Client ist erlaubt.
access.requireUsername.tip=CONNECT ohne Benutzername wird mit MQTT Reason Code 0x86 (Bad User Name or Password) abgelehnt. Enthaelt die Benutzerliste unten Eintraege, muessen Benutzername und Passwort exakt zu einem Eintrag passen; bei leerer Liste genuegt ein vorhandener Benutzername.
access.requireClientCertificate.tip=CONNECT ohne TLS-Client-Zertifikat wird mit MQTT Reason Code 0x87 (Not authorized) abgelehnt. Das ist eine Access-Regel, keine TLS-Einstellung: Bei Listenern mit Client-Zertifikatsmodus NONE wird das Zertifikat optional angefordert, damit der Broker sauber beim CONNECT ablehnen kann statt im TLS-Handshake zu scheitern.
access.blockedPrefix.tip=Publish und Subscribe auf Topics mit diesem Prefix werden mit MQTT Reason Code 0x87 abgelehnt; die Verbindung bleibt bestehen. Leer lassen, um kein Topic zu blockieren.
access.users.tip=Tragen Sie je Zeile einen Access-Benutzer als user=password ein. Die Liste wird nur verwendet, solange "Benutzername verlangen" aktiv ist, und blockiert sonst keine Verbindung. Sie wird in diesem Benutzerprofil verschluesselt gespeichert; Passwoerter werden nie geloggt.
section.listeners=Netzwerk-Listener
section.listeners.tip=Hier verwalten Sie alle Netzwerk-Endpunkte des Brokers. Jeder Eintrag ist ein Listener; TCP/TLS/WS/WSS koennen beliebig kombiniert werden, jeweils mit eigenem Zertifikat, Zertifikatspasswort und Client-Zertifikatsmodus.
section.security=TLS, Client-Zertifikate und Zugriff
section.security.tip=TLS-Zertifikat, Zertifikatspasswort und Client-Zertifikatsmodus werden pro Listener im Listener-Editor gesetzt. Diese Karte enthaelt die fachlichen Zugriffsregeln nach MQTT CONNECT.
section.diagnostics=Diagnose
section.diagnostics.tip=Steuert, wie viele Broker-Diagnosemeldungen im Tool-Log erscheinen.
