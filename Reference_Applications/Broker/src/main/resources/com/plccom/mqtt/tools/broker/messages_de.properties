listener.table.tip=Listenerliste. Doppelklick auf eine Zeile oder Bearbeiten aendert Transport, Bind-Adresse, Port, WebSocket-Pfad, Zertifikat, Zertifikatspasswort und Client-Zertifikatsmodus. Zertifikat=Standard wird passend zum Listener-Host verwaltet; explizite Aliase werden unveraendert verwendet und bei Host-Mismatch nur gewarnt. Endpoint zeigt die vollstaendige Adresse fuer Clients.
