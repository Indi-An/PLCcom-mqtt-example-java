section.security=TLS, Client-Zertifikate und Zugriff
section.security.tip=TLS/WSS verwendet die Broker-Identitaet aus pki/own. Client-Zertifikate werden ueber denselben PLCcom PKI-Ordner geprueft und im Access-Validator sichtbar.
