listener.diagnosticLevel.tip=Steuert, welche Broker-Diagnosemeldungen angezeigt werden. Zugriffsablehnungen sind Warnungen; waehlen Sie Warnung oder ein ausfuehrlicheres Level, um abgelehnte CONNECT-, PUBLISH- und SUBSCRIBE-Entscheidungen zu sehen.
listener.diagnosticThrottle.tip=Mindestabstand fuer wiederholte gleichartige Diagnosemeldungen, damit die Anwendung nicht geflutet wird.
access.row.tip=Demo-Zugriffspruefung fuer manuelle Tests. Ohne eigene Broker-Access-Validator-Implementierung ist der Broker offen.
access.demoValidator.tip=Aktiviert den eingebauten Demo-Validator dieses Tools.
access.requireUsername.tip=Der Demo-Validator laesst CONNECT nur mit Benutzername zu.
access.requireClientCertificate.tip=Der Demo-Validator laesst CONNECT nur zu, wenn der Client ein vertrautes TLS-Benutzerzertifikat sendet. Wenn der Client-Zertifikatsmodus noch auf NONE steht, fordert das Tool beim Brokerstart trotzdem verpflichtend ein TLS-Client-Zertifikat an. Die PKI prueft nur das Zertifikatsvertrauen; die eigentliche Benutzer- und Rechteentscheidung gehoert in den Access-Validator.
access.blockedPrefix.tip=Der Demo-Validator verweigert Publish/Subscribe auf Topics mit diesem Prefix.
access.certificate.none=kein Zertifikat
