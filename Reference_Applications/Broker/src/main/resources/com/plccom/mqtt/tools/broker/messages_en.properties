button.start.tip=Starts the broker with the currently configured listeners.
button.stop.tip=Stops the running broker and closes its listeners.
button.refreshStatistics.tip=Reads the current broker admin snapshot and statistic values again.
button.resetCounters.tip=Resets the broker diagnostic counters.
button.clearMessages.tip=Clears the visible message table.
button.copyLog.tip=Copies the selected log part, or the complete log when nothing is selected, to the clipboard.
button.saveLog.tip=Saves the visible log to a file.
button.clearLog.tip=Clears the log output.
listener.clientCertMode.tip=Defines whether client certificates are unused, accepted optionally or required.
listener.maxConnections.tip=Maximum number of simultaneous network connections to the broker.
listener.socketReadTimeout.tip=Timeout for blocking socket read operations. It helps detect hanging connections cleanly.
listener.diagnosticLevel.tip=Controls which broker diagnostic events are shown. Access denials are warnings; choose Warning or a more detailed level to see rejected CONNECT, PUBLISH and SUBSCRIBE decisions.
listener.diagnosticThrottle.tip=Minimum gap for repeated diagnostic events of the same kind, so the application is not flooded.
access.row.tip=Demo access check for manual tests. Without a custom broker access validator implementation, the broker is open.
access.demoValidator.tip=Enables this tool's built-in demo validator.
access.requireUsername.tip=The demo validator allows CONNECT only when a user name is present.
access.requireClientCertificate.tip=The demo validator allows CONNECT only when the client sends a trusted TLS user certificate. If the client-certificate mode is still NONE, the tool still requires a TLS client certificate when the broker starts. The PKI checks certificate trust only; the real user and permission decision belongs in the access validator.
access.blockedPrefix.tip=The demo validator denies publish/subscribe on topics with this prefix.
access.certificate.none=no certificate
section.listeners=Network listeners
section.listeners.tip=Manage all broker network endpoints here. Each row is one listener; TCP/TLS/WS/WSS can be combined freely.
section.security=TLS, client certificates and access
section.security.tip=TLS/WSS uses the broker identity from pki/own. Client certificates are verified through the same PLCcom PKI folder and exposed to the access validator.
