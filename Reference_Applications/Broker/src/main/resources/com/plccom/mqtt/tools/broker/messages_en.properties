button.start.tip=Starts the broker with the currently configured listeners.
button.stop.tip=Stops the running broker and closes its listeners.
button.refreshStatistics.tip=Reads the current broker admin snapshot and statistic values again.
button.resetCounters.tip=Resets the broker diagnostic counters.
button.clearMessages.tip=Clears the visible message table.
button.copyLog.tip=Copies the selected log part, or the complete log when nothing is selected, to the clipboard.
button.saveLog.tip=Saves the visible log to a file.
button.clearLog.tip=Clears the log output.
button.logWindow.tip=Opens the log output in an additional large window with live updates and a switchable auto-scroll.
listener.clientCertMode.tip=TLS handshake policy of this listener: NONE never requests a client certificate, OPTIONAL requests one but accepts connections without it, REQUIRED aborts the TLS handshake when the client sends no certificate. Each TLS/WSS listener has its own mode.
listener.maxConnections.tip=Maximum number of simultaneous network connections to the broker.
listener.socketReadTimeout.tip=Timeout for blocking socket read operations. It helps detect hanging connections cleanly.
listener.diagnosticLevel.tip=Controls the whole log: broker diagnostic events and the tool messages. Access denials are warnings; choose Warning or a more detailed level to see rejected CONNECT, PUBLISH and SUBSCRIBE decisions. Off hides everything.
access.row.tip=Business-level access rules checked after MQTT CONNECT and for every publish/subscribe. When no rule is active, no access validator is installed and every client is allowed.
access.requireUsername.tip=CONNECT without a user name is denied with MQTT reason code 0x86 (Bad User Name or Password). When the users list below contains entries, user name and password must match exactly one entry; with an empty list a present user name is sufficient.
access.requireClientCertificate.tip=CONNECT without a TLS client certificate is denied with MQTT reason code 0x87 (Not authorized). This is an access rule, not a TLS setting: on listeners with client-certificate mode NONE the certificate is requested optionally so the broker can deny cleanly at CONNECT instead of failing the TLS handshake.
access.blockedPrefix.tip=Publish and subscribe on topics starting with this prefix are denied with MQTT reason code 0x87 while the connection stays open. Leave empty to disable topic blocking.
access.users.tip=Enter one access user per line as user=password. The list is only used while "Require user name" is active and never blocks connections otherwise. It is stored encrypted in this user profile; passwords are never logged.
section.listeners=Network listeners
section.listeners.tip=Manage all broker network endpoints here. Each row is one listener; TCP/TLS/WS/WSS can be combined freely, each with its own certificate, certificate password and client-certificate mode.
section.security=TLS, client certificates and access
section.security.tip=TLS certificate, certificate password and client-certificate mode are configured per listener in the listener editor. This card holds the business access rules that apply after MQTT CONNECT.
section.diagnostics=Diagnostics
section.diagnostics.tip=Controls how many broker diagnostic events are shown in the tool log.
