will.title=Last Will / Testament
will.title.tip=MQTT Last Will Testament: Der Client hinterlegt beim Verbinden eine Nachricht, die der Broker nur bei ungeplantem Verbindungsabbruch veroeffentlicht. Sauberes Trennen loest sie nicht aus.
will.dialog.title=MQTT Last Will / Testament
will.enabled=Testament aktivieren
will.topic=Last-Will Topic
will.payload=Last-Will Payload
will.qos=Last-Will QoS
will.flags=Flags
will.retain=Retain
will.delay=Will Delay (s, 0=aus)
will.expiry=Will Expiry (s, 0=aus)
will.contentType=Content Type
will.enabled.tip=Aktiviert das MQTT Last Will Testament. Der Broker veroeffentlicht diese Nachricht nur, wenn die Verbindung ungewollt abbricht, nicht bei sauberem Trennen.
will.topic.tip=Topic Name, auf dem der Broker das Last Will veroeffentlicht. Keine Wildcards verwenden.
will.payload.tip=Payload des Testaments, zum Beispiel ein Offline-Status. Diese Payload wird erst vom Broker gesendet, wenn der Client unerwartet verschwindet.
will.qos.tip=QoS fuer die Last-Will-Nachricht. QoS 1 ist ein guter Standard fuer Statusmeldungen.
will.flags.tip=Zusatzschalter fuer das Testament. Retain speichert den Offline-Status als letzten bekannten Zustand des Topics.
will.retain.tip=Wenn aktiv, speichert der Broker das Last Will als retained Nachricht. Neue Subscriber sehen den Offline-Status dann sofort.
will.delay.tip=MQTT-5-Will-Delay in Sekunden. Der Broker wartet nach einem ungeplanten Verbindungsabbruch, bevor er das Testament sendet. 0 bedeutet sofort.
will.expiry.tip=MQTT-5-Ablaufzeit der Last-Will-Nachricht in Sekunden. 0 bedeutet: keinen Expiry-Wert senden.
will.contentType.tip=Optionaler MQTT-5-Hinweis auf das Payload-Format des Testaments, zum Beispiel text/plain oder application/json.
error.will.topic.required=Wenn das Testament aktiviert ist, muss ein Last-Will Topic eingetragen sein.
log.tls.clientCertificate.disabled=TLS-Client-Zertifikat ist nicht aktiviert; der Client sendet beim TLS-Handshake kein Benutzerzertifikat.
log.tls.clientCertificate.loaded=TLS-Client-Zertifikat aktiviert: PKI-Alias={0}, KeyStore-Aliase={1}
