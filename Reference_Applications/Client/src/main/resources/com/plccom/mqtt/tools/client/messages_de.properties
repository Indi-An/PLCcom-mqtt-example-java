request.payload=Payload
request.info=<html><div style='width:250px'>MQTT selbst kennt keine eingebaute Frage/Antwort. MQTT 5 ergaenzt sie ueber zwei Nachrichten-Properties: <b>Response Topic</b> und <b>Correlation Data</b>. Dieser Reiter ist der Anfrager: er sendet die Anfrage und wartet bis zu 5 Sekunden auf die passende Antwort, die dann im Log und im Reiter Nachrichten erscheint. Ein Responder abonniert das Request-Topic und antwortet auf dem Response-Topic mit demselben Correlation-Token.</div></html>
