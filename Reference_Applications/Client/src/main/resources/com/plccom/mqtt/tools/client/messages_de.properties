button.connect.tip=Oeffnet die MQTT-Verbindung mit den aktuellen Eingaben auf der Verbindungsseite.
button.disconnect.tip=Trennt die aktuelle MQTT-Verbindung geordnet.
button.close.tip=Schliesst diesen Dialog.
button.lastWillSettings.tip=Oeffnet die Detailfelder fuer das MQTT Last Will Testament.
button.publish.tip=Sendet die Payload an das angegebene Topic.
button.deleteRetained.tip=Loescht den retained Zustand fuer das Topic durch eine retained Nachricht mit leerer Payload.
button.request.tip=Veroeffentlicht die Anfrage und wartet bis zu 5 Sekunden auf die passende MQTT-5-Antwort.
button.subscribe.tip=Startet eine Subscription auf den angegebenen Topic Filter.
button.receiveOnce.tip=Wartet einmalig auf die naechste passende Nachricht im Receive-Timeout.
button.unsubscribeAll.tip=Beendet alle Subscriptions, die dieses Tool aktuell offen haelt.
button.clearMessages.tip=Leert die sichtbare Nachrichtentabelle.
button.copyLog.tip=Kopiert den markierten Log-Ausschnitt oder den kompletten Log in die Zwischenablage.
button.saveLog.tip=Speichert den sichtbaren Log in eine Datei.
button.clearLog.tip=Leert die Logausgabe.
button.logWindow.tip=Oeffnet die Logausgabe zusaetzlich in einem grossen Fenster mit Live-Aktualisierung und abschaltbarem Auto-Scroll.
connect.endpoint.tip=MQTT Endpoint URI. Erlaubt sind mqtt://, mqtts://, ws:// und wss://. Benutzername und Passwort gehoeren in die separaten Felder. Der Assistent kann die URI bequem erzeugen; direkte Eingaben werden vor dem Verbinden geprueft.
connect.clientId.tip=Eindeutiger MQTT Client Identifier. Leer lassen, wenn der Broker eine ID vergeben darf.
connect.protocol.tip=AUTO versucht zuerst MQTT 5 und faellt bei Bedarf auf MQTT 3.1.1 zurueck.
connect.username.tip=Optionaler Benutzername fuer Broker, die Login-Daten verlangen.
connect.password.tip=Optionales Passwort fuer Broker, die Login-Daten verlangen.
connect.keepAlive.tip=Zeit in Sekunden, nach der Client und Broker pruefen, ob die Verbindung noch lebt.
connect.topicAlias.tip=MQTT-5-Grenze fuer Topic Aliases. 0 bedeutet: keine Topic Aliases anfordern.
connect.connectTimeout.tip=Maximale Zeit fuer den Aufbau der TCP/TLS/WebSocket-Verbindung.
connect.operationTimeout.tip=Maximale Wartezeit fuer normale MQTT-Operationen wie Publish, Subscribe oder Disconnect.
connect.diagnosticLevel.tip=Steuert das gesamte Log: SDK-Diagnosemeldungen und die Meldungen des Tools. Debug zeigt alles inklusive Nachrichteninhalten, Info ist der normale Standard, Warnung/Fehler reduzieren die Ausgabe auf Probleme, Fatal zeigt nur fatale SDK-Fehler, Aus blendet alles aus.
connect.options.tip=Startverhalten der Client-Session und automatische Wiederverbindung.
connect.cleanStart.tip=Startet ohne alte Session-Daten. Ausschalten, wenn der Broker eine dauerhafte Session fortsetzen soll.
connect.reconnect.tip=Versucht nach Netzwerkabbruch automatisch eine neue Verbindung aufzubauen.
publish.topic.tip=Topic Name, an den diese Nachricht gesendet wird.
publish.payload.tip=Nutzdaten der Nachricht. Bei Textbeispielen wird UTF-8 verwendet.
publish.qos.tip=MQTT Quality of Service: QoS 0 hoechstens einmal, QoS 1 mindestens einmal, QoS 2 genau einmal.
publish.contentType.tip=Optionaler MQTT-5-Hinweis auf das Payload-Format, zum Beispiel text/plain oder application/json. Das ist kein Topic Name; Wildcards wie # oder + gehoeren hier nicht hinein.
publish.expiry.tip=MQTT-5-Ablaufzeit in Sekunden. Nach Ablauf soll die Nachricht nicht mehr zugestellt werden. 0 bedeutet: keinen Expiry-Wert senden, also fuer normale Tests ausgeschaltet.
publish.responseTopic.tip=MQTT-5-Response-Topic fuer Request/Response-Muster. Nur fuellen, wenn ein Empfaenger seine Antwort auf dieses Topic publishen soll.
publish.correlationData.tip=MQTT-5-Korrelationswert, mit dem Request und Response einander zugeordnet werden. Meist nur zusammen mit Response Topic sinnvoll.
publish.userPropertyName.tip=Optionaler MQTT-5-Name fuer eine User Property. Wird nur zusammen mit dem Wert gesendet und sollte keine geheimen Daten enthalten.
publish.userPropertyValue.tip=Optionaler MQTT-5-Wert fuer eine User Property, zum Beispiel unit=degC oder source=client-tool. Wird nur zusammen mit dem Namen gesendet.
publish.flags.tip=Zusatzschalter fuer die Publish-Nachricht.
publish.retain.tip=Speichert diese Nachricht als letzten bekannten Zustand fuer das Topic. Neue Subscriber koennen sie sofort als retained Replay erhalten.
subscribe.topic.tip=Topic Filter, den der Client abonnieren soll. Wildcards wie # und + sind erlaubt.
subscribe.qos.tip=Hoechste QoS-Stufe, mit der der Client Nachrichten auf dieser Subscription erhalten moechte.
subscribe.sharedRow.tip=MQTT Shared Subscription verteilt passende Nachrichten auf mehrere Consumer derselben Share Group. Fuer normale Einzel-Client-Tests ausgeschaltet lassen.
subscribe.shared.tip=Aktiviert das MQTT-Shared-Subscription-Format fuer den angegebenen Topic Filter. Mehrere Clients mit gleichem Share Name teilen sich die Nachrichten.
subscribe.sharedGroup.tip=Name der Shared-Subscription-Gruppe, zum Beispiel tool-workers. Das ist ein Gruppenname, kein Topic.
subscribe.mqtt5.tip=Optionen, die nur bei MQTT 5 verfuegbar sind.
subscribe.noLocal.tip=Verhindert, dass dieser Client seine eigenen Publish-Nachrichten ueber diese Subscription zurueckbekommt. Hilfreich gegen Echo-Nachrichten.
subscribe.retainAsPublished.tip=Erhaelt das Retain-Flag so, wie es der Publisher gesetzt hat, damit der Empfaenger das Original-Retain-Verhalten erkennen kann.
subscribe.retainHandling.tip=Legt fest, ob retained Nachrichten beim Subscribe sofort replayed werden: immer, nur bei neuer Subscription oder gar nicht.
subscribe.identifier.tip=MQTT-5-Identifier, mit dem eingehende Nachrichten ihrer Subscription zugeordnet werden koennen. Hilfreich bei mehreren Subscriptions im selben Client.
subscribe.identifier.enabled.tip=Sendet den Subscription Identifier an den Broker.
subscribe.receiveTimeout.tip=Maximale Wartezeit fuer den Button "Einmal empfangen".
request.topic.tip=Topic Name, auf dem die Anfrage veroeffentlicht wird. Ein Responder muss dieses Topic abonnieren.
request.responseTopic.tip=MQTT-5-Response-Topic, auf dem der Responder die Antwort senden soll. Das Tool abonniert hier und wartet auf die Antwort.
request.payload.tip=Anfrage-Payload, zum Beispiel ein Kommando oder der Name eines zu lesenden Wertes. Textbeispiele nutzen UTF-8.
connect.pkiStore=PLCcom PKI-Ordner
connect.pkiStore.tip=Fester PLCcom PKI-Ordner fuer TLS. Das Tool verwendet automatisch den plattformneutralen Benutzerordner PLCcom/Mqtt/Client/pki und legt die Unterordner own/certs, own/private, trusted/certs, trusted/crl, issuers/certs, issuers/crl und rejected/certs an. Broker-Zertifikate werden mit trusted, issuers und rejected geprueft.
connect.clientCertificate=TLS-Client-Zertifikat senden
connect.clientCertificate.tip=Sendet beim TLS-Handshake ein eigenes Client-Zertifikat und aktiviert damit mTLS fuer Broker, die ein Client-Zertifikat verlangen. Nur dann wird die eigene Client-Identitaet aus pki/own geladen; normale TLS-Verbindungen pruefen weiterhin nur das Broker-Zertifikat.
connect.pkiOwnAlias=Own-Zertifikat Alias
connect.pkiOwnAlias.tip=Alias fuer die eigene Client-Tool-Identitaet im PLCcom PKI-Store. Das Tool verwendet standardmaessig den Appnamen PLCcom.Mqtt.Tools.Client und sucht dazu unter pki/own/certs und pki/own/private.

connect.certificatePassword=Zertifikatspasswort
connect.certificatePassword.tip=Passwort fuer die eigene Client-Identitaet im PLCcom PKI-Ordner. Leer lassen, wenn Private Key oder Container nicht passwortgeschuetzt sind.

