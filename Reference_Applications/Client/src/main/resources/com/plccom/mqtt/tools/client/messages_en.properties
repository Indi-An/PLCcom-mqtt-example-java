request.info=<html><div style='width:250px'>MQTT itself has no built-in request/response. MQTT 5 adds it with two message properties: <b>Response Topic</b> and <b>Correlation Data</b>. This tab is the requester: it publishes the request, then waits up to 5 seconds for the matching reply and shows it in the log and the Messages tab. A responder subscribes to the request topic and answers on the response topic with the same correlation token.</div></html>
