button.connect.tip=Opens the MQTT connection with the current inputs on the Connection page.
button.disconnect.tip=Closes the current MQTT connection cleanly.
button.close.tip=Closes this dialog.
button.lastWillSettings.tip=Opens the detail fields for the MQTT Last Will Testament.
button.publish.tip=Sends the payload to the configured topic.
button.deleteRetained.tip=Deletes retained state for the topic by sending a retained message with an empty payload.
button.request.tip=Publishes the request and waits up to 5 seconds for the matching MQTT 5 response.
button.subscribe.tip=Starts a subscription for the configured Topic Filter.
button.receiveOnce.tip=Waits once for the next matching message within the receive timeout.
button.unsubscribeAll.tip=Stops all subscriptions currently held by this tool.
button.clearMessages.tip=Clears the visible message table.
button.copyLog.tip=Copies the selected log part, or the complete log when nothing is selected, to the clipboard.
button.saveLog.tip=Saves the visible log to a file.
button.clearLog.tip=Clears the log output.
button.logWindow.tip=Opens the log output in an additional large window with live updates and a switchable auto-scroll.
connect.endpoint.tip=MQTT endpoint URI. Allowed schemes are mqtt://, mqtts://, ws:// and wss://. User name and password belong in the separate fields. The assistant can create the URI for you; direct input is validated before connecting.
connect.clientId.tip=Unique MQTT Client Identifier. Leave it empty when the broker may assign an id.
connect.protocol.tip=AUTO tries MQTT 5 first and falls back to MQTT 3.1.1 when needed.
connect.username.tip=Optional user name for brokers that require login data.
connect.password.tip=Optional password for brokers that require login data.
connect.keepAlive.tip=Time in seconds after which client and broker check whether the connection is still alive.
connect.topicAlias.tip=MQTT 5 limit for Topic Aliases. 0 means no Topic Aliases are requested.
connect.connectTimeout.tip=Maximum time for opening the TCP/TLS/WebSocket connection.
connect.operationTimeout.tip=Maximum wait time for normal MQTT operations such as publish, subscribe or disconnect.
connect.diagnosticLevel.tip=Controls the whole log: SDK diagnostic events and the tool messages. Debug shows everything including message payloads, Info is the normal default, Warning/Error reduce the output to problems, Fatal shows only fatal SDK failures, Off hides everything.
connect.options.tip=Client session start behavior and automatic reconnect.
connect.cleanStart.tip=Starts without old session data. Disable it when the broker should resume a persistent session.
connect.reconnect.tip=Automatically tries to reconnect after a network interruption.
publish.topic.tip=Topic Name to which this message is sent.
publish.payload.tip=Message payload. Text examples use UTF-8.
publish.qos.tip=MQTT Quality of Service: QoS 0 at most once, QoS 1 at least once, QoS 2 exactly once.
publish.contentType.tip=Optional MQTT 5 hint for the payload format, for example text/plain or application/json. This is not a Topic Name; wildcards such as # or + do not belong here.
publish.expiry.tip=MQTT 5 expiry time in seconds. After expiry the message should no longer be delivered. 0 means: send no expiry value, so it is off for normal tests.
publish.responseTopic.tip=MQTT 5 Response Topic for request/response patterns. Fill it only when a receiver should publish its answer to this topic.
publish.correlationData.tip=MQTT 5 correlation value used to match request and response. Usually useful only together with Response Topic.
publish.userPropertyName.tip=Optional MQTT 5 User Property name. It is sent only together with the value and should not contain secret data.
publish.userPropertyValue.tip=Optional MQTT 5 User Property value, for example unit=degC or source=client-tool. It is sent only together with the name.
publish.flags.tip=Additional switches for the publish message.
publish.retain.tip=Stores this message as the latest known state for the topic. New subscribers can receive it immediately as retained replay.
subscribe.topic.tip=Topic Filter the client should subscribe to. Wildcards such as # and + are allowed.
subscribe.qos.tip=Highest QoS level with which the client wants to receive messages for this subscription.
subscribe.sharedRow.tip=MQTT Shared Subscription distributes matching messages across several consumers in the same share group. Keep it off for normal single-client tests.
subscribe.shared.tip=Enables the MQTT Shared Subscription format for the configured Topic Filter. Several clients with the same Share Name share the messages.
subscribe.sharedGroup.tip=Name of the Shared Subscription group, for example tool-workers. This is a group name, not a topic.
subscribe.mqtt5.tip=Options that are available only with MQTT 5.
subscribe.noLocal.tip=Prevents this client from receiving its own published messages through this subscription. Useful to avoid echo messages.
subscribe.retainAsPublished.tip=Preserves the Retain flag as set by the publisher so the receiver can see the original retain behavior.
subscribe.retainHandling.tip=Defines whether retained messages are replayed immediately when subscribing: always, only for a new subscription, or never.
subscribe.identifier.tip=MQTT 5 identifier that can be used to map incoming messages to their subscription. Useful with several subscriptions in one client.
subscribe.identifier.enabled.tip=Sends the Subscription Identifier to the broker.
subscribe.receiveTimeout.tip=Maximum wait time for the "Receive once" button.
request.topic.tip=Topic Name on which the request is published. A responder must subscribe to this topic.
request.responseTopic.tip=MQTT 5 Response Topic where the responder should publish the answer. The tool subscribes here and waits for the reply.
request.payload.tip=Request payload, for example a command or the name of a value to read. Text examples use UTF-8.
connect.pkiStore=PLCcom PKI folder
connect.pkiStore.tip=Fixed PLCcom PKI folder for TLS. The tool automatically uses the cross-platform per-user PLCcom/Mqtt/Client/pki folder and creates own/certs, own/private, trusted/certs, trusted/crl, issuers/certs, issuers/crl and rejected/certs. Broker certificates are checked with trusted, issuers and rejected.
connect.clientCertificate=Send TLS client certificate
connect.clientCertificate.tip=Sends an own client certificate during the TLS handshake and enables mTLS for brokers that require a client certificate. Only then is the own client identity loaded from pki/own; normal TLS connections still only verify the broker certificate.
connect.pkiOwnAlias=Own certificate alias
connect.pkiOwnAlias.tip=Alias for the own Client Tool identity in the PLCcom PKI store. The tool uses the application name PLCcom.Mqtt.Tools.Client by default and looks under pki/own/certs and pki/own/private.

connect.certificatePassword=Certificate password
connect.certificatePassword.tip=Password for the own client identity in the PLCcom PKI folder. Leave it empty when the private key or container is not password-protected.

