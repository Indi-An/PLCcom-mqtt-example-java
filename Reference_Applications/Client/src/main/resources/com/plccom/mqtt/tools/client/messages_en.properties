will.title=Last Will / Testament
will.title.tip=MQTT Last Will Testament: during connect the client registers a message that the broker publishes only after an unplanned disconnect. A clean disconnect does not publish it.
will.dialog.title=MQTT Last Will / Testament
will.enabled=Enable testament
will.topic=Last Will Topic
will.payload=Last Will Payload
will.qos=Last Will QoS
will.flags=Flags
will.retain=Retain
will.delay=Will Delay (s, 0=off)
will.expiry=Will Expiry (s, 0=off)
will.contentType=Content Type
will.enabled.tip=Enables the MQTT Last Will Testament. The broker publishes this message only when the connection breaks unexpectedly, not after a clean disconnect.
will.topic.tip=Topic Name on which the broker publishes the Last Will. Do not use wildcards.
will.payload.tip=Payload of the testament, for example an offline status. The broker sends this payload only when the client disappears unexpectedly.
will.qos.tip=QoS for the Last Will message. QoS 1 is a good default for status messages.
will.flags.tip=Additional switches for the testament. Retain stores the offline status as the latest known state of the topic.
will.retain.tip=When enabled, the broker stores the Last Will as retained message. New subscribers then see the offline status immediately.
will.delay.tip=MQTT 5 Will Delay in seconds. The broker waits after an unplanned disconnect before sending the testament. 0 means immediately.
will.expiry.tip=MQTT 5 expiry time of the Last Will message in seconds. 0 means: send no expiry value.
will.contentType.tip=Optional MQTT 5 hint for the testament payload format, for example text/plain or application/json.
error.will.topic.required=When the testament is enabled, a Last Will Topic is required.
log.tls.clientCertificate.disabled=TLS client certificate is disabled; the client will not send a user certificate during the TLS handshake.
log.tls.clientCertificate.loaded=TLS client certificate enabled: PKI alias={0}, KeyStore aliases={1}
